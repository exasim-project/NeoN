stages:
  - build
  - test
  - deploy

# ============================================================
#  GPU-specific images and runner configuration
# ============================================================
.gpu-nvidia:
  tags: ["nvidia-gpus"]
  image: chihtaw/cuda-openfoam-ginkgo:12.8.1-v2412-arch_89
  variables:
    GPU_VENDOR: nvidia

.gpu-amd:
  tags: ["amd-gpus"]
  image: chihtaw/rocm-openfoam-ginkgo:6.4.1-v2412-arch_gfx90a
  variables:
    GPU_VENDOR: amd

.gpu-intel:
  tags: ["intel-gpus"]
  image: dheerajraghunathan/oneapi-openfoam-ginkgo:2025.3-v2412-arch_pvc
  variables:
    GPU_VENDOR: intel

# ============================================================
#  Benchmarking setup
# ============================================================
.setup-for-benchmarking:
  variables:
    RESULTS_DIR: "benchmark-results"
    RUN_IDENTIFIER: "${CI_PIPELINE_ID}"
    REPO_NAME: "NeoFOAM-BenchmarkData"
    TARGET_REPO: "github.com/exasim-project/${REPO_NAME}.git"
    TARGET_BRANCH: "ci-benchmarks"

  before_script:
    - pip3 install --user --break-system-packages xmltodict

# ============================================================
#  Rule blocks
# ============================================================
# testing
.rules-neon-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always
    - when: never

# benchmarking
.rules-neon-benchmarking:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK == "true"'
      when: always
    - when: never

# ============================================================
#  Job templates
# ============================================================
.build-and-test:
  variables:
    CMAKE_BUILD_PARALLEL_LEVEL: "3"
  script:
    - ./ci/lrz-gitlab/build-and-test.sh

.benchmark:
  extends:
    - .setup-for-benchmarking
  variables:
    CMAKE_BUILD_PARALLEL_LEVEL: "3"
  script:
    - ./ci/lrz-gitlab/benchmark.sh

.build-python-wheel:
  variables:
    CMAKE_BUILD_PARALLEL_LEVEL: "3"
  before_script:
    - python3 -m pip install --user --break-system-packages build
  script:
    - python3 -m build --wheel
    - python3 ci/smoke_test_wheel.py
  artifacts:
    paths:
      - dist/*.whl

.pixi-python-package:
  image: ghcr.io/prefix-dev/pixi:latest
  variables:
    CMAKE_BUILD_PARALLEL_LEVEL: "1"
  before_script:
    - pixi install --locked

# ============================================================
#  NeoN - testing jobs
# ============================================================
build-test-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-testing
    - .build-and-test

build-test-neon-amd:
  extends:
    - .gpu-amd
    - .rules-neon-testing
    - .build-and-test

build-test-neon-intel:
  extends:
    - .gpu-intel
    - .rules-neon-testing
    - .build-and-test

# ============================================================
#  NeoN - benchmarking jobs
# ============================================================
benchmark-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-benchmarking
    - .benchmark

benchmark-neon-amd:
  extends:
    - .gpu-amd
    - .rules-neon-benchmarking
    - .benchmark

benchmark-neon-intel:
  extends:
    - .gpu-intel
    - .rules-neon-benchmarking
    - .benchmark

# ============================================================
#  NeoN - Python packaging job
# ============================================================
build-python-wheel-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-testing
    - .build-python-wheel

build-python-wheel-pixi:
  extends:
    - .pixi-python-package
  stage: build
  script:
    - pixi run -e build smoke-test
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

publish-python-wheel-pypi:
  extends:
    - .pixi-python-package
  stage: deploy
  needs:
    - job: build-python-wheel-pixi
      artifacts: true
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pixi run -e release twine upload dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
