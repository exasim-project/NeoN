# ============================================================
#  GPU-specific images and runner configuration
# ============================================================
# Ginkgo develop with Umpire support (ginkgo-project/ginkgo#2125), built by
# exasim-project/ginkgo-packaging, with MPICH built from source (GPU-aware for CUDA and ROCm).
# Pinned by digest: the runner caches SIF images by name, so a rebuilt tag would not be pulled again.
.gpu-nvidia:
  tags: ["nvidia-gpus"]
  image: ghcr.io/exasim-project/ginkgo-cuda@sha256:1abfff63da2d6dcfc0ec55602e08dce787f0f051634a8d29f7a9e3133fa68c5a # nightly-20261115
  variables:
    GPU_VENDOR: nvidia

.gpu-amd:
  tags: ["amd-gpus"]
  image: ghcr.io/exasim-project/ginkgo-rocm@sha256:7e8f1909a027899a9ebee7da69bcc18fcc809cdfa7ce4db0894aa7010af3c876 # nightly-20261115
  variables:
    GPU_VENDOR: amd

.gpu-intel:
  tags: ["intel-gpus"]
  image: ghcr.io/exasim-project/ginkgo-sycl@sha256:88ac6fdb13a80a6394d6a3da09a93a5223a206bd4e754231bcd433a9110a9be8 # nightly-20261115
  variables:
    GPU_VENDOR: intel

# ============================================================
#  Benchmarking setup
# ============================================================
.setup-for-benchmarking:
  variables:
    RESULTS_DIR: "benchmark-results"
    RUN_IDENTIFIER: "${CI_PIPELINE_ID}"
    REPO_NAME: "NeoFOAM-BenchmarkData"
    TARGET_REPO: "github.com/exasim-project/${REPO_NAME}.git"

  before_script:
    - pip3 install --user --break-system-packages xmltodict

# ============================================================
#  Rule blocks
# ============================================================
# testing
.rules-neon-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always
    - when: never

# benchmarking
.rules-neon-benchmarking:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK == "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK == "true"'
      when: always
    - when: never

# ============================================================
#  Job templates
# ============================================================
.build-and-test:
  script:
    - ./ci/lrz-gitlab/build-and-test.sh

.benchmark:
  extends:
    - .setup-for-benchmarking
  script:
    - ./ci/lrz-gitlab/benchmark.sh

# ============================================================
#  NeoN - testing jobs
# ============================================================
build-test-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-testing
    - .build-and-test

build-test-neon-amd:
  extends:
    - .gpu-amd
    - .rules-neon-testing
    - .build-and-test

build-test-neon-intel:
  extends:
    - .gpu-intel
    - .rules-neon-testing
    - .build-and-test

# ============================================================
#  NeoN - benchmarking jobs
# ============================================================
benchmark-neon-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-neon-benchmarking
    - .benchmark

benchmark-neon-amd:
  extends:
    - .gpu-amd
    - .rules-neon-benchmarking
    - .benchmark

benchmark-neon-intel:
  extends:
    - .gpu-intel
    - .rules-neon-benchmarking
    - .benchmark
