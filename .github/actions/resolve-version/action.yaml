name: Resolve package version
description: >
  Stable version from a v* tag, otherwise a nightly version, so that conda packages and
  wheels built from the same commit carry the same version.
outputs:
  version:
    description: Package version
    value: ${{ steps.version.outputs.version }}
  channel:
    description: stable or nightly
    value: ${{ steps.version.outputs.channel }}
runs:
  using: composite
  steps:
    - name: Resolve stable or nightly version
      id: version
      shell: bash
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
        else
          serial="$(date -u +%Y%m%d%H%M)${GITHUB_RUN_NUMBER}"
          version="$(python scripts/set_package_version.py --nightly "${serial}")"
          channel="nightly"
        fi

        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
