name: Build documentation

env:
  PR_NUMBER: ${{ github.event.number }}

# PR previews are only built when the PR changes something the docs are built from. The
# doxygen API pages also read include/, but nearly every PR touches it; those changes show up
# in latest once merged. latest and the versioned docs are always rebuilt.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "doc/**"
      - "examples/**" # literalinclude'd by the docs
      - ".github/workflows/build_doc.yaml"
  push:
    branches: [develop]
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'exasim-project/NeoN' && github.event.action != 'closed'
    steps:
    - name: Requirements
      run: sudo apt-get update
        && sudo apt-get install -y doxygen python3-sphinx texlive-font-utils
        && pip3 install furo
        && pip3 install breathe
        && pip3 install sphinx-sitemap
        && pip3 install sphinxcontrib-mermaid
    - name: Checkout repo
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        cache: 'pip'
    - run: pip install -r doc/requirements.txt

    - name: Build docs
      run: |
        sphinx-build -b html ./doc ./docs_build/
        # Furo renders a red ERROR banner over any `.. contents::` block
        # unless the escape-hatch class is set; sphinx does not warn about it
        if grep -roE 'class="contents( [^"]*)?"' docs_build --include='*.html' \
            | grep -v this-will-duplicate-information-and-it-is-still-useful-here; then
          echo "::error::Remove '.. contents::' directives, Furo shows a TOC in the sidebar"
          exit 1
        fi
        cp -r doc/_build/ docs_build/doxygen
        cd docs_build
        ls doxygen
        touch .nojekyll
    # The welcome comment that links the preview is posted by label-pr.yaml
    - name: Deploy PR Build
      if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs_build
        target-folder: Build_PR_${{ env.PR_NUMBER }}
    - name: Deploy Versioned Build
      if: ${{ github.ref_type == 'tag'}}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs_build
        target-folder: ${{ github.ref_name }}

    - name: Deploy Latest Build
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs_build
        target-folder: latest

    - name: Echo Build PR URL
      if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
      run: |
        echo "Deploy to: https://exasim-project.com/NeoN/Build_PR_${{ env.PR_NUMBER }}"

  remove-pr-preview:
    runs-on: ubuntu-latest
    if: github.repository == 'exasim-project/NeoN' && github.event.action == 'closed'
    permissions:
      contents: write
    steps:
    - name: Checkout gh-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
    - name: Remove PR preview
      run: |
        if [ -d "Build_PR_${PR_NUMBER}" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "Build_PR_${PR_NUMBER}"
          git commit -m "Remove preview for PR #${PR_NUMBER}"
          git push origin gh-pages
        fi
