name: Build NeoN with sanitizer
run-name: 'Build workflow'

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: synchronize
  schedule:
    - cron: "0 9 * * *"

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  OMPI_MCA_rmaps_base_oversubscribe: 1


concurrency:
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'exasim-project/NeoN' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    name: Build NeoN with sanitizer
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - CC: gcc
            CXX: g++
        preset: ["NeoN_ENABLE_SANITIZE_ADDRESS=ON",
          "NeoN_ENABLE_SANITIZE_UB=ON",
          "NeoN_ENABLE_SANITIZE_MEMORY=ON"
        ]
    runs-on: ubuntu-latest
    # Ginkgo nightly (develop) image from exasim-project/ginkgo-packaging, see build_on_ubuntu.yaml
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/exasim-project/ginkgo-cpu:nightly
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v4

     - name: Set up cache
       uses: actions/cache@v4
       if: ${{!contains(github.event.pull_request.labels.*.name, 'Skip-cache')}}
       with:
         path: build
         key: ubuntu_build_PR_${{ github.event.pull_request.number }}_${{matrix.compiler.CC}}_${{matrix.preset}}

     - name: Get versions
       run: |
         g++ --version
         ninja --version
         cmake --version

     - name: Build NeoN
       run: |
         CC=${{matrix.compiler.CC}} \
         CXX=${{matrix.compiler.CXX}} \
         cmake --preset develop -D${{matrix.preset}} \
           -DNeoN_BUILD_TESTS=ON \
           -DNeoN_DEVEL_TOOLS=OFF \
           -DNeoN_ENABLE_MPI_WITH_THREAD_SUPPORT=OFF
         cmake --build  --preset develop

     - name: Execute unit tests NeoN
       run: |
         export LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/scripts/san_ignores.txt
         LD_PRELOAD=/usr/lib/gcc/x86_64-linux-gnu/13/libasan.so ctest --preset develop
