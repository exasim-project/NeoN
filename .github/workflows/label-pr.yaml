name: Label PR

# Add area (type:*) and kind labels based on the PR title, branch and diff, see
# .github/scripts/label_pr.py. Runs as pull_request_target so fork PRs can be labeled too;
# it checks out the base branch for the script and only reads the PR through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.repository == 'exasim-project/NeoN'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Label PR
        run: python3 .github/scripts/label_pr.py ${{ github.event.pull_request.number }}
