name: CI images
run-name: CI images

# Builds the LRZ GitLab CI images from ci/dockerfiles/Dockerfile on top of
# the Ginkgo images of exasim-project/ginkgo-packaging, and pushes them on develop
# and from pull requests of this repository (not forks) as
# ghcr.io/exasim-project/neon-ci-<vendor>:ginkgo-<GINKGO_TAG>, the image .gitlab-ci.yml
# runs on. A pull request therefore overwrites the image used by all LRZ pipelines.
# NeoFOAM builds its CI images (with OpenFOAM) on top of these.
on:
  pull_request:
    paths:
      - ci/dockerfiles/**
      - .github/workflows/ci-images.yaml
  push:
    branches: [develop]
    paths:
      - ci/dockerfiles/**
      - .github/workflows/ci-images.yaml
  workflow_dispatch:

env:
  # Tag of ghcr.io/exasim-project/ginkgo-{cuda,rocm,sycl}. The image records the
  # Ginkgo commit it contains in /opt/ginkgo/share/ginkgo-revision; keep
  # NeoN_GINKGO_TAG in cmake/Versions.cmake at that commit.
  GINKGO_TAG: nightly

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.vendor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: nvidia
            backend: cuda
            compiler: nvcc
          - vendor: amd
            backend: rocm
            compiler: hipcc
          - vendor: intel
            backend: sycl
            compiler: icpx
    env:
      IMAGE: ghcr.io/exasim-project/neon-ci-${{ matrix.vendor }}
    steps:
      - uses: actions/checkout@v4

      # The Ginkgo base images are 4-6 GB compressed and several times that unpacked,
      # more than a hosted runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Build the image
        run: |
          docker build -f ci/dockerfiles/Dockerfile \
            --build-arg GINKGO_BACKEND="${{ matrix.backend }}" \
            --build-arg GINKGO_TAG="${GINKGO_TAG}" \
            -t "${IMAGE}:ginkgo-${GINKGO_TAG}" ci/dockerfiles

      # No GPU on the runner: only check that the tools the CI scripts call are there.
      - name: Run the smoke test
        run: |
          docker run --rm "${IMAGE}:ginkgo-${GINKGO_TAG}" bash -c "
            set -e
            cat /opt/ginkgo/share/ginkgo-revision
            cmake --version
            ${{ matrix.compiler }} --version
            command -v mpirun
            pre-commit --version
            python3 -c 'import xmltodict'"

      # Pull requests from forks get a read-only token and cannot push.
      - name: Log in to ghcr.io
        if: >
          github.ref == 'refs/heads/develop' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: >
          github.ref == 'refs/heads/develop' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker push "${IMAGE}:ginkgo-${GINKGO_TAG}"
