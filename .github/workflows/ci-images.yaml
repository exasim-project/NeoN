name: CI images
run-name: CI images

# Builds the LRZ GitLab CI images from ci/dockerfiles/Dockerfile on top of
# the Ginkgo images of exasim-project/ginkgo-packaging, and pushes them on develop
# as ghcr.io/exasim-project/neon-ci-<vendor>:ginkgo-<GINKGO_TAG>.
# NeoFOAM builds its CI images (with OpenFOAM) on top of these.
on:
  pull_request:
    paths:
      - ci/dockerfiles/**
      - .github/workflows/ci-images.yaml
  push:
    branches: [develop]
    paths:
      - ci/dockerfiles/**
      - .github/workflows/ci-images.yaml
  workflow_dispatch:

env:
  # Tag of ghcr.io/exasim-project/ginkgo-{cuda,rocm,sycl}. When NeoN_GINKGO_TAG in
  # cmake/Versions.cmake changes, set this to the newest nightly-YYYYMMDD tag.
  GINKGO_TAG: nightly-20261010

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.vendor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: nvidia
            backend: cuda
            compiler: nvcc
          - vendor: amd
            backend: rocm
            compiler: hipcc
          - vendor: intel
            backend: sycl
            compiler: icpx
    env:
      IMAGE: ghcr.io/exasim-project/neon-ci-${{ matrix.vendor }}
    steps:
      - uses: actions/checkout@v4

      # The CUDA, ROCm and oneAPI base images alone take up to 30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Build the image
        run: |
          docker build -f ci/dockerfiles/Dockerfile \
            --build-arg GINKGO_BACKEND="${{ matrix.backend }}" \
            --build-arg GINKGO_TAG="${GINKGO_TAG}" \
            -t "${IMAGE}:ginkgo-${GINKGO_TAG}" ci/dockerfiles

      # No GPU on the runner: only check that the tools the CI scripts call are there.
      - name: Run the smoke test
        run: |
          docker run --rm "${IMAGE}:ginkgo-${GINKGO_TAG}" bash -c "
            set -e
            cat /opt/ginkgo/share/ginkgo-revision
            cmake --version
            ${{ matrix.compiler }} --version
            command -v mpirun
            pre-commit --version
            python3 -c 'import xmltodict'"

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.ref == 'refs/heads/develop'
        run: docker push "${IMAGE}:ginkgo-${GINKGO_TAG}"
