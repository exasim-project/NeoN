[project]
name = "neon_pde"
version = "0.1.0"
authors = [
    {name = "NeoN authors", email = "neon@example.com"}
]
description = "Python bindings for the NeoN CFD framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.19.0",
    "jax",
    "equinox",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "ruff>=0.14.0",
    "mypy",
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=2.9.0",
]
test = [
    "pytest>=6.0",
]
all = [
    "neon_pde[dev,test]",
]
cuda = [
    "jax[cuda12-local]",
    "nvidia-cudnn-cu12",
]

[build-system]
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=2.9.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.args = ["--preset=production"]
build.verbose = true
build-dir = "_skbuild"
editable.mode = "redirect"
editable.verbose = true
editable.rebuild = false

[tool.scikit-build.cmake.define]
NeoN_BUILD_PYTHON_BINDINGS = "ON"
NeoN_WITH_AMREX = "ON"
NeoN_WITH_UMPIRE = "OFF"
AMReX_INSTALL = "ON"
CMAKE_BUILD_WITH_INSTALL_RPATH = "ON"

[tool.uv]
no-build-isolation-package = ["neon_pde"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    # Selects the tests that need more than one rank. `mpirun -n 2 pytest -m mpi`
    # is the whole CI lane (the "Test blockAMR on 2 MPI ranks" step of NeoFOAM's
    # build-python job -- NeoN's own workflows build no AMReX); a bare `pytest`
    # still collects them and they skip themselves. The selection has to be a marker
    # rather than `-k`, because running the REST of the suite under mpirun would
    # have every rank redo the same single-rank test over a different box
    # distribution.
    "mpi: needs >1 MPI rank; skips itself otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
